on:
  push:
    branches: [main]
  pull_request:
  release:
    types:
      - created

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-frontend-module.yml@main
    with:
      verify_command: yarn verify

  # Publishes a pre-release (npm tag "next") on push to main, and a release (npm tag "latest")
  # when a GitHub Release is created. The ci:* scripts publish every workspace except the root package.
  publish:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/release-frontend-module.yml@main
    # contents: write is needed by the called workflow's github_release job (tagged-release mode),
    # which is skipped here but still has to be permitted. id-token: write is for npm OIDC publishing.
    permissions:
      contents: write
      id-token: write
    with:
      publish: true
      trigger_downstream_build: false
      pre_release_version_command: yarn workspaces foreach --worktree --topological --exclude @pih/openmrs-esm-pihemr version "$PRERELEASE_VERSION"
      pre_release_publish_command: yarn run ci:prepublish
      release_version_command: yarn workspaces foreach --all --topological version "$RELEASE_VERSION"
      release_publish_command: yarn run ci:publish

  trigger-frontend-build:
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          repository: PIH/openmrs-frontend-pihemr
          event-type: dependency-trigger
